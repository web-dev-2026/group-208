<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guruh 208 — talabalar saytlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EEF1F5;
    --ink: #1B2A4A;
    --muted: #56627C;
    --line: #C9D1DE;
    --mark: #F2C230;
    --mark-ink: #1B2A4A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #121A2E;
      --ink: #E6EBF4;
      --muted: #9AA6BF;
      --line: #2B3655;
      --mark: #F2C230;
      --mark-ink: #121A2E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.5;
  }
  .wrap { max-width: 64rem; margin: 0 auto; padding: 0 1.25rem; }

  header { padding: 3rem 0 2.5rem; border-bottom: 2px solid var(--ink); }
  .group {
    display: block;
    font-size: clamp(6rem, 24vw, 15rem);
    font-weight: 800;
    line-height: 0.82;
    letter-spacing: -0.05em;
    margin: 0 0 1.25rem -0.06em;
  }
  .group .label {
    display: block;
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1.3;
    margin: 0 0 0.75rem 0.06em;
  }
  .intro { max-width: 36rem; margin: 0; color: var(--muted); }
  .count { margin: 0.75rem 0 0; font-weight: 600; }

  main { padding: 1rem 0 4rem; }
  .status { padding: 2rem 0; color: var(--muted); max-width: 36rem; }
  ul.students { list-style: none; margin: 0; padding: 0; }
  .student {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.25rem 1.5rem;
    align-items: baseline;
    padding: 1.25rem 0;
    border-bottom: 1px solid var(--line);
  }
  .name {
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    font-weight: 600;
    line-height: 1.15;
    color: var(--ink);
    text-decoration: none;
    background: linear-gradient(var(--mark), var(--mark)) 0 100% / 0 40% no-repeat;
    transition: background-size 0.25s ease;
  }
  .name:hover, .name:focus-visible { background-size: 100% 40%; }
  .meta { color: var(--muted); font-size: 0.9375rem; white-space: nowrap; }
  .topics { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; margin: 0.35rem 0 0; padding: 0; list-style: none; }
  .topics a { color: var(--muted); font-size: 0.9375rem; text-underline-offset: 3px; }
  .topics a:hover { color: var(--ink); }

  footer { padding: 2rem 0 3rem; color: var(--muted); font-size: 0.9375rem; }
  footer a { color: inherit; }

  a:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; border-radius: 2px; }
  @media (max-width: 34rem) {
    .student { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .name { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1 class="group"><span class="label">Veb-sayt dizayni va ishlab chiqish</span>208</h1>
      <p class="intro">Guruh talabalarining saytlari. Ro'yxat har bir qabul qilingan Pull Request'dan keyin o'zi yangilanadi.</p>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <p class="status" id="status" aria-live="polite">Ro'yxat yuklanmoqda…</p>
    <ul class="students" id="list"></ul>
  </main>

  <footer class="wrap">
    <a href="https://github.com/web-dev-2026/group-208">Repozitoriy GitHub'da</a>
  </footer>

<script>
(function () {
  var ORG = "web-dev-2026";
  var REPO = "group-208";
  var CACHE_KEY = "showcase:" + ORG + "/" + REPO;
  var CACHE_MS = 10 * 60 * 1000; // GitHub limits anonymous requests, so cache for 10 minutes

  var statusEl = document.getElementById("status");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");

  function readCache() {
    try {
      var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      if (c && Date.now() - c.time < CACHE_MS) return c.entries;
    } catch (e) {}
    return null;
  }
  function writeCache(entries) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), entries: entries })); } catch (e) {}
  }

  function loadEntries() {
    var cached = readCache();
    if (cached) return Promise.resolve(cached);
    var url = "https://api.github.com/repos/" + ORG + "/" + REPO + "/git/trees/main?recursive=1";
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function (data) {
      var entries = (data.tree || [])
        .filter(function (e) { return e.type === "tree" && e.path.indexOf("students/") === 0; })
        .map(function (e) { return e.path; });
      writeCache(entries);
      return entries;
    });
  }

  function displayName(slug) {
    return slug.split("-").filter(Boolean).map(function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(" ");
  }

  function build(paths) {
    var students = {};
    paths.forEach(function (p) {
      var parts = p.split("/");
      var slug = parts[1];
      if (!slug || /^[._]/.test(slug)) return;          // skip _template and hidden folders
      if (!students[slug]) students[slug] = [];
      if (parts.length === 3 && /^\d/.test(parts[2])) students[slug].push(parts[2]); // topic folders start with a number
    });
    return Object.keys(students).sort().map(function (slug) {
      return { slug: slug, topics: students[slug].sort() };
    });
  }

  function render(students) {
    listEl.textContent = "";
    if (!students.length) {
      statusEl.textContent = "Hali hech kim qo'shilmagan. Birinchi bo'lib 00-setup vazifasini topshiring.";
      countEl.textContent = "";
      return;
    }
    statusEl.hidden = true;
    var pages = 0;
    students.forEach(function (s) {
      pages += s.topics.length;
      var base = "students/" + encodeURIComponent(s.slug) + "/";
      var li = document.createElement("li");
      li.className = "student";

      var a = document.createElement("a");
      a.className = "name";
      a.href = base;
      a.textContent = displayName(s.slug);
      li.appendChild(a);

      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = s.topics.length ? s.topics.length + " ta mavzu" : "Hali mavzu yo'q";
      li.appendChild(meta);

      if (s.topics.length) {
        var ul = document.createElement("ul");
        ul.className = "topics";
        s.topics.forEach(function (t) {
          var tli = document.createElement("li");
          var ta = document.createElement("a");
          ta.href = base + encodeURIComponent(t) + "/";
          ta.textContent = t;
          tli.appendChild(ta);
          ul.appendChild(tli);
        });
        li.appendChild(ul);
      }
      listEl.appendChild(li);
    });
    countEl.textContent = students.length + " ta talaba, " + pages + " ta sahifa";
  }

  loadEntries().then(function (paths) {
    render(build(paths));
  }).catch(function (err) {
    statusEl.textContent = (err.message === "403" || err.message === "429")
      ? "GitHub hozircha ro'yxatni bermadi (so'rovlar chegarasi). Bir necha daqiqadan keyin sahifani yangilang."
      : "Ro'yxatni yuklab bo'lmadi. Internet aloqasini tekshirib, sahifani yangilang.";
  });
})();
</script>
</body>
</html>
